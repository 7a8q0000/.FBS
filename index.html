<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow47q - Live YouTube System</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@800;900&display=swap" rel="stylesheet">
<style>body{font-family:'Tajawal',sans-serif;background:#0c0a18}.glow-card{background:linear-gradient(135deg,#1a1630,#15122a);border:1px solid rgba(168,85,247,.3)}</style>
</head>
<body class="text-white p-6">
<div class="max-w-7xl mx-auto">
<div class="bg-[#13111f] border border-purple-900/30 rounded-2xl p-5 flex gap-4 items-center">
<div class="flex-1 grid grid-cols-2 gap-3">
<input id="apiKey" placeholder="حط YouTube API Key هنا (مجاني)" class="bg-[#1e1b30] border border-purple-900/30 rounded-xl px-4 py-3 text-sm">
<input id="channel" value="@Shadow47q" placeholder="@Shadow47q أو Channel ID" class="bg-[#1e1b30] border border-purple-900/30 rounded-xl px-4 py-3 text-sm">
</div>
<button onclick="connect()" class="bg-gradient-to-r from-purple-600 to-indigo-600 px-8 py-3 rounded-xl font-black">ربط القناة 🔴</button>
</div>
<p class="text-xs text-gray-400 mt-3">كيف تجيب API Key مجاناً: ادخل console.cloud.google.com > فعل YouTube Data API v3 > Credentials > Create API Key - ثواني بس</p>

<div class="grid grid-cols-4 gap-4 mt-8">
<div class="glow-card rounded-2xl p-5"><p class="text-gray-400 text-xs">المشتركين الحقيقيين</p><p id="subs" class="text-3xl font-black mt-2">--</p><p class="text-[11px] text-purple-400 mt-1">LIVE من يوتيوب</p></div>
<div class="glow-card rounded-2xl p-5"><p class="text-gray-400 text-xs">إجمالي المشاهدات</p><p id="views" class="text-3xl font-black mt-2">--</p><p class="text-[11px] text-purple-400 mt-1">LIVE</p></div>
<div class="glow-card rounded-2xl p-5"><p class="text-gray-400 text-xs">عدد الفيديوهات</p><p id="count" class="text-3xl font-black mt-2">--</p><p class="text-[11px] text-purple-400 mt-1">LIVE</p></div>
<div class="glow-card rounded-2xl p-5 bg-gradient-to-br from-purple-700 to-indigo-800"><p class="text-purple-200 text-xs">حالة الربط</p><p id="status" class="text-xl font-black mt-2">غير مربوط</p></div>
</div>

<div class="mt-8 bg-[#15132a] rounded-2xl border border-purple-900/20 overflow-hidden">
<div class="p-5 flex justify-between"><h3 class="font-black text-xl">فيديوهات Shadow47q الحقيقية</h3><span id="channelName" class="text-purple-400 text-sm"></span></div>
<div id="videos" class="divide-y divide-purple-900/10"></div>
</div>
</div>

<script>
async function connect(){
const key=document.getElementById('apiKey').value.trim();
let channelInput=document.getElementById('channel').value.trim();
if(!key){alert('حط API Key أول');return}
localStorage.setItem('yt_key',key); localStorage.setItem('yt_channel',channelInput);
document.getElementById('status').innerText='جاري الربط...';

try{
let channelId=channelInput;
if(channelInput.startsWith('@')){
const res=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=channel&q=${channelInput}&key=${key}`);
const data=await res.json();
if(!data.items||!data.items[0]) throw new Error('القناة مو موجودة، جرب Channel ID');
channelId=data.items[0].id.channelId;
}
const chRes=await fetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics,snippet&id=${channelId}&key=${key}`);
const chData=await chRes.json();
if(!chData.items[0]) throw new Error('Channel not found');
const stats=chData.items[0].statistics;
const snippet=chData.items[0].snippet;
document.getElementById('subs').innerText=Number(stats.subscriberCount).toLocaleString();
document.getElementById('views').innerText=Number(stats.viewCount).toLocaleString();
document.getElementById('count').innerText=stats.videoCount;
document.getElementById('channelName').innerText=snippet.title;
document.getElementById('status').innerText='✅ مربوط LIVE';

const vidRes=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${channelId}&maxResults=20&order=date&type=video&key=${key}`);
const vidData=await vidRes.json();
const list=document.getElementById('videos'); list.innerHTML='';
for(let item of vidData.items){
const vidId=item.id.videoId;
const det=await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${vidId}&key=${key}`);
const detData=await det.json();
const vstat=detData.items[0]?.statistics||{};
const div=document.createElement('div');
div.className='p-4 flex gap-4 hover:bg-[#1e1b30]';
div.innerHTML=`<img src="${item.snippet.thumbnails.medium.url}" class="w-40 h-24 rounded-xl object-cover"><div class="flex-1"><p class="font-bold text-sm">${item.snippet.title}</p><p class="text-xs text-gray-400 mt-1">${new Date(item.snippet.publishedAt).toLocaleDateString('ar-EG')} • 👁️ ${Number(vstat.viewCount||0).toLocaleString()} • 👍 ${Number(vstat.likeCount||0).toLocaleString()} • 💬 ${Number(vstat.commentCount||0).toLocaleString()}</p><a href="https://youtube.com/watch?v=${vidId}" target="_blank" class="text-purple-400 text-xs underline mt-2 inline-block">فتح في يوتيوب</a></div>`;
list.appendChild(div);
}
}catch(e){document.getElementById('status').innerText='❌ خطأ: '+e.message; alert(e.message)}
}
window.onload=()=>{const k=localStorage.getItem('yt_key');const c=localStorage.getItem('yt_channel');if(k){document.getElementById('apiKey').value=k}if(c){document.getElementById('channel').value=c}}
</script>
</body>
</html>
